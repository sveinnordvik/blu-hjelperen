name: Deploy til Firebase (Hosting & Functions)

on:
  push:
    branches:
      - main # Endre til 'master' hvis det er standardgrenen din

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer og bygg frontend (React)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install
          npm run build

      - name: Installer backend-avhengigheter (Functions)
        run: |
          cd functions
          npm install

      - name: Konfigurer miljøvariabler for backend
        run: |
          cd functions
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: Rull ut Hosting til Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting --project gen-lang-client-0721397173 --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive

      - name: Rull ut Cloud Functions til Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only functions --project gen-lang-client-0721397173 --token "${{ secrets.FIREBASE_TOKEN }}" --force --non-interactive
        continue-on-error: true
