name: Deploy til Firebase (Hosting & Functions)

on:
  push:
    branches:
      - main # Endre til 'master' hvis det er standardgrenen din

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Oppdatert til 22 for å møte Firebase-kravet

      - name: Installer og bygg frontend (React)
        run: |
          npm install
          npm run build

      - name: Installer backend-avhengigheter (Functions)
        run: |
          cd functions
          npm install

      - name: Konfigurer miljøvariabler for backend
        run: |
          cd functions
          rm -f .env
          echo "FIRESTORE_DATABASE_ID=ai-studio-6d584f24-0d3b-4358-ba43-396b2f0a6101" >> .env
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> .env
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env
          echo "GEMINI_API_KEY_FREE=${{ secrets.GEMINI_API_KEY_FREE }}" >> .env
          echo "GEMINI_API_KEY_PRIMARY=${{ secrets.GEMINI_API_KEY_PRIMARY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GEMINI_API_KEY_PAID=${{ secrets.GEMINI_API_KEY_PAID }}" >> .env
          echo "GEMINI_API_KEY_BACKUP=${{ secrets.GEMINI_API_KEY_BACKUP }}" >> .env

      - name: Rydd funksjoner med feil triggertype eller generasjon før v2-utrulling
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          LIST_RAW=$(npx --yes firebase-tools functions:list --json --project gen-lang-client-0721397173 --token "$FIREBASE_TOKEN" 2>/dev/null || echo '{"result":[]}')
          DELETE_TARGETS=$(node -e '
            const raw = String(process.argv[1] || "");
            const start = raw.indexOf("{");
            const end = raw.lastIndexOf("}");
            if (start === -1 || end === -1 || end < start) process.exit(0);
            let data;
            try { data = JSON.parse(raw.slice(start, end + 1)); } catch { process.exit(0); }
            const list = Array.isArray(data.result) ? data.result : (Array.isArray(data) ? data : []);

            const expected = {
              stripeWebhook:             { platform: "gcfv1", trigger: "https" },
              superveilederenChat:       { platform: "gcfv1", trigger: "https" },
              pedlederAI:                { platform: "gcfv1", trigger: "https" },
              askBlu:                    { platform: "gcfv1", trigger: "https" },
              api:                       { platform: "gcfv2", trigger: "https" },
              kallGeminiAPI:             { platform: "gcfv2", trigger: "https" },
              handleNewUserReferralV2:   { platform: "gcfv2", trigger: "event" },
              handleNewUserReferral:     { platform: "gcfv2", trigger: "event" },
              checklistDispatcher:       { platform: "gcfv2", trigger: "schedule" },
              generateClosingChecklists: { platform: "gcfv2", trigger: "schedule" },
            };

            const detectTrigger = (fn) => {
              if (fn.scheduleTrigger) return "schedule";
              if (fn.eventTrigger) {
                const evtType = String(fn.eventTrigger.eventType || "").toLowerCase();
                if (evtType.includes("schedule")) return "schedule";
                return "event";
              }
              if (fn.httpsTrigger || fn.callableTrigger) return "https";
              return "unknown";
            };

            const normalizePlatform = (fn) => {
              const p = String(fn.platform || "").toLowerCase();
              const env = String(fn.environment || "").toLowerCase();
              if (p === "gcfv1" || env === "gen_1" || env === "1st gen") return "gcfv1";
              if (p === "gcfv2" || env === "gen_2" || env === "2nd gen") return "gcfv2";
              return p || "unknown";
            };

            for (const fn of list) {
              const id = fn.id || (fn.name ? String(fn.name).split("/").pop() : "");
              const spec = expected[id];
              if (!spec) continue;
              const actualPlatform = normalizePlatform(fn);
              const actualTrigger = detectTrigger(fn);
              const region = fn.region || "europe-west1";
              const platformMismatch = actualPlatform !== "unknown" && actualPlatform !== spec.platform;
              const triggerMismatch = actualTrigger !== "unknown" && actualTrigger !== spec.trigger;
              console.error(`[Pre-flight] ${id} (${region}): actual=${actualPlatform}/${actualTrigger}, expected=${spec.platform}/${spec.trigger}`);
              if (platformMismatch || triggerMismatch) {
                console.log(`${id}|${region}|${actualPlatform}/${actualTrigger}->${spec.platform}/${spec.trigger}`);
              }
            }
          ' "$LIST_RAW")

          for entry in $DELETE_TARGETS; do
            IFS='|' read -r FN_ID FN_REGION REASON <<< "$entry"
            echo "Fjerner utdatert funksjon $FN_ID i $FN_REGION ($REASON) før ny utrulling..."
            npx --yes firebase-tools functions:delete "$FN_ID" --region "$FN_REGION" --project gen-lang-client-0721397173 --token "$FIREBASE_TOKEN" --force
          done

      - name: Rull ut Cloud Functions til Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools deploy --only functions --project gen-lang-client-0721397173 --token "${{ secrets.FIREBASE_TOKEN }}" --force --non-interactive

      - name: Rull ut Hosting til Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting --project gen-lang-client-0721397173 --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive